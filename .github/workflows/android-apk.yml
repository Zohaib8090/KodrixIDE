name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest GitHub-hosted runners ship a preinstalled Android SDK,
      # but `sdkmanager` lives under a version-specific cmdline-tools folder
      # (e.g. cmdline-tools/16.0/bin) that isn't on PATH by default. Locate
      # it dynamically instead of hardcoding a version that may drift as the
      # runner image updates. We deliberately do NOT use the
      # android-actions/setup-android action here: its v3 setup step runs
      # `sdkmanager tools`, which installs the legacy "tools" package that
      # Google removed from the SDK repository years ago, so that action
      # fails outright before the build even starts.
      - name: Add Android cmdline-tools to PATH
        run: |
          SDKMANAGER_PATH=$(find "$ANDROID_HOME" -type f -name sdkmanager | sort -V | tail -n1)
          echo "$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      # The ABI splits config in androidApp/build.gradle.kts produces one APK per
      # architecture plus a universal one. Sort them into per-ABI names by matching
      # the ABI string AGP always embeds in the filename (regardless of the exact
      # prefix), so each architecture can be uploaded as its own artifact below —
      # letting you download only the ~250-300MB you need instead of the full
      # ~1.1GB bundle. x86_64 is matched before x86 since "x86" is a substring of it.
      - name: Sort APKs by architecture
        run: |
          mkdir -p apk_out
          for f in androidApp/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f")
            for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
              case "$base" in
                *"$abi"*) cp "$f" "apk_out/kodrix-debug-$abi.apk"; break ;;
              esac
            done
          done
          echo "Sorted APKs:"
          ls -la apk_out

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodrix-debug-apk-arm64-v8a
          path: apk_out/kodrix-debug-arm64-v8a.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodrix-debug-apk-armeabi-v7a
          path: apk_out/kodrix-debug-armeabi-v7a.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: kodrix-debug-apk-x86_64
          path: apk_out/kodrix-debug-x86_64.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: kodrix-debug-apk-x86
          path: apk_out/kodrix-debug-x86.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: kodrix-debug-apk-universal
          path: apk_out/kodrix-debug-universal.apk
          retention-days: 14
          if-no-files-found: warn
