name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest GitHub-hosted runners ship a preinstalled Android SDK,
      # but `sdkmanager` lives under a version-specific cmdline-tools folder
      # (e.g. cmdline-tools/16.0/bin) that isn't on PATH by default. Locate
      # it dynamically instead of hardcoding a version that may drift as the
      # runner image updates. We deliberately do NOT use the
      # android-actions/setup-android action here: its v3 setup step runs
      # `sdkmanager tools`, which installs the legacy "tools" package that
      # Google removed from the SDK repository years ago, so that action
      # fails outright before the build even starts.
      - name: Add Android cmdline-tools to PATH
        run: |
          SDKMANAGER_PATH=$(find "$ANDROID_HOME" -type f -name sdkmanager | sort -V | tail -n1)
          echo "$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodrix-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
