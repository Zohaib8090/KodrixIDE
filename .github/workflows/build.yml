name: Build Desktop DEB

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with artifacts"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: "Build DEB Package"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot file

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deb-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deb-

      - name: Build DEB
        run: ./gradlew :desktopApp:packageDeb --no-daemon

      - name: Collect artifact
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f -name "*.deb" \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/
          retention-days: 30

  release:
    name: "Create Release"
    needs: [build-deb]
    if: github.event.inputs.publish_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Kodrix IDE v1.2.0"
          body: |
            ## Kodrix IDE v1.2.0

            ### Install
            ```bash
            sudo dpkg -i kodrix-ide_1.2.0_amd64.deb
            ```
          draft: false
          prerelease: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}