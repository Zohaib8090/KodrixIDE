name: Build All Packages

on:
  push:
    branches: [test, main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Android APK (all ABIs) ────────────────────────────────────────────
  build-android:
    name: "Android APK (all ABIs)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;30.0.14904198"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/debug -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/
          retention-days: 30

  # ── Linux: DEB, RPM, AppImage ────────────────────────────────────────
  build-linux:
    name: "Linux ${{ matrix.arch }} (DEB + RPM + AppImage)"
    runs-on: ${{ matrix.runner }}
    needs: []  # run in parallel with Android
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK (x86_64 only)
        if: matrix.arch == 'x86_64'
        uses: android-actions/setup-android@v3

      - name: Setup Android SDK (ARM workaround)
        if: matrix.arch == 'aarch64'
        env:
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev fakeroot libfuse2 file

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DEB
        run: ./gradlew :desktopApp:packageDeb --no-daemon

      - name: Build RPM
        if: matrix.arch == 'x86_64'
        run: ./gradlew :desktopApp:packageRpm --no-daemon

      - name: Build AppImage
        run: ./gradlew :desktopApp:packageAppImage --no-daemon

      - name: Create AppImage (fallback if Gradle didn't produce one)
        run: |
          mkdir -p dist
          AI=$(find desktopApp/build/compose/binaries/main -name "*.AppImage" -type f | head -1)
          if [ -n "$AI" ]; then
              echo "✅ Gradle produced AppImage: $(basename "$AI")"
          else
              echo "⚠️  No .AppImage found — creating manually with appimagetool"
              APP_DIR="desktopApp/build/compose/binaries/main/app/kodrix-ide"
              if [ -d "$APP_DIR" ]; then
                  # Compose Desktop doesn't create .desktop file — add one for appimagetool
                  # NOTE: Use printf to avoid heredoc indentation issues in YAML
                  printf '%s\n' \
                    '[Desktop Entry]' \
                    'Name=Kodrix IDE' \
                    'Exec=kodrix-ide' \
                    'Icon=kodrix-ide' \
                    'Type=Application' \
                    'Categories=Development;IDE;' \
                    > "$APP_DIR/kodrix-ide.desktop"
                  # Copy icon (check jpackage output, then source dirs)
                  if [ -f "$APP_DIR/lib/kodrix-ide.png" ]; then
                      cp "$APP_DIR/lib/kodrix-ide.png" "$APP_DIR/kodrix-ide.png"
                  elif [ -f desktopApp/icon.png ]; then
                      cp desktopApp/icon.png "$APP_DIR/kodrix-ide.png"
                  elif [ -f desktopApp/build/resources/main/icon.png ]; then
                      cp desktopApp/build/resources/main/icon.png "$APP_DIR/kodrix-ide.png"
                  else
                      printf '\x89PNG\r\n\x1a\n' > "$APP_DIR/kodrix-ide.png"
                  fi
                  # Download appimagetool and extract it (it's itself an AppImage)
                  curl -fSL --retry 3 "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool.AppImage
                  chmod +x /tmp/appimagetool.AppImage
                  # Extract appimagetool since FUSE isn't available on CI
                  /tmp/appimagetool.AppImage --appimage-extract 2>/dev/null || true
                  if [ -x squashfs-root/AppRun ]; then
                      AI_TOOL="./squashfs-root/AppRun"
                  elif [ -x /tmp/appimagetool.AppImage ]; then
                      # Try running directly (may work without FUSE for creation)
                      AI_TOOL="/tmp/appimagetool.AppImage"
                  else
                      echo "❌ appimagetool not available"
                      exit 1
                  fi
                  ARCH=${{ matrix.arch == 'aarch64' && 'aarch64' || 'x86_64' }}
                  $AI_TOOL --no-fuse "$APP_DIR" "dist/kodrix-ide-1.2.0-${ARCH}.AppImage" 2>&1 || \
                  $AI_TOOL "$APP_DIR" "dist/kodrix-ide-1.2.0-${ARCH}.AppImage" 2>&1
                  echo "✅ AppImage created"
                  ls -lh dist/
              else
                  echo "❌ App directory not found: $APP_DIR"
                  ls -R desktopApp/build/compose/binaries/main/ || true
              fi
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/
          retention-days: 30

  # ── macOS: DMG ────────────────────────────────────────────────────────
  build-macos:
    name: "macOS arm64 (DMG)"
    runs-on: macos-latest
    needs: []  # run in parallel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK & accept licences
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      - name: Collect artifact
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f -name "*.dmg" \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: dist/
          retention-days: 30

  # ── Windows: MSI + Exe ────────────────────────────────────────────────
  build-windows:
    name: "Windows (MSI + Exe)"
    runs-on: windows-latest
    needs: []  # run in parallel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK & accept licences
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi --no-daemon
        shell: bash

      - name: Build Exe
        run: ./gradlew :desktopApp:packageExe --no-daemon
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f \
            \( -name "*.msi" -o -name "*.exe" \) \
            -exec cp {} dist/ \;
          ls -lh dist/
        shell: bash

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/
          retention-days: 30