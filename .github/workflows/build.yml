name: Build Desktop Packages

on:
  push:
    branches: [test, main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux: DEB, RPM, AppImage ────────────────────────────────────────
  build-linux:
    name: "Linux (DEB + RPM + AppImage)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK & accept licences
        uses: android-actions/setup-android@v3

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev fakeroot libfuse2 file

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DEB
        run: ./gradlew :desktopApp:packageDeb --no-daemon

      - name: Build RPM
        run: ./gradlew :desktopApp:packageRpm --no-daemon

      - name: Build AppImage
        run: ./gradlew :desktopApp:packageAppImage --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/
          retention-days: 30

  # ── macOS: DMG ────────────────────────────────────────────────────────
  build-macos:
    name: "macOS (DMG)"
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK & accept licences
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      - name: Collect artifact
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f -name "*.dmg" \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/
          retention-days: 30

  # ── Windows: MSI + Exe ────────────────────────────────────────────────
  build-windows:
    name: "Windows (MSI + Exe)"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK & accept licences
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi --no-daemon
        shell: bash

      - name: Build Exe
        run: ./gradlew :desktopApp:packageExe --no-daemon
        shell: bash

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f \
            \( -name "*.msi" -o -name "*.exe" \) \
            -exec cp {} dist/ \;
          ls -lh dist/
        shell: bash

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/
          retention-days: 30