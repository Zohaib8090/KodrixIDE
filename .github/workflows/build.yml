name: Build Desktop Packages

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with artifacts"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build on Linux (RPM, AppImage, Deb) ──────────────────────────────
  build-linux:
    name: "Linux Packages"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm \
            dpkg-dev \
            fakeroot \
            libfuse2 \
            file

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-linux-

      - name: Build RPM
        run: ./gradlew :desktopApp:packageRpm --no-daemon

      - name: Build AppImage
        run: ./gradlew :desktopApp:packageAppImage --no-daemon

      - name: Build Deb
        run: ./gradlew :desktopApp:packageDeb --no-daemon

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f \
            \( -name "*.rpm" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/
          retention-days: 30

  # ── Build on macOS (DMG) ─────────────────────────────────────────────
  build-macos:
    name: "macOS DMG"
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/native
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-macos-

      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist
          find desktopApp/build/compose/binaries/main -type f -name "*.dmg" \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/
          retention-days: 30

  # ── Release (optional) ───────────────────────────────────────────────
  release:
    name: "Create Release"
    needs: [build-linux, build-macos]
    if: github.event.inputs.publish_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: List artifacts
        run: find all-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Kodrix IDE v1.2.0"
          body: |
            ## Kodrix IDE v1.2.0

            ### Downloads
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
            - **macOS**: `.dmg`

            ### Install
            ```bash
            # Linux (AppImage)
            chmod +x Kodrix-IDE-1.2.0.AppImage
            ./Kodrix-IDE-1.2.0.AppImage

            # Linux (Deb)
            sudo dpkg -i kodrix-ide_1.2.0_amd64.deb

            # Linux (RPM)
            sudo rpm -i kodrix-ide-1.2.0.x86_64.rpm

            # macOS
            open Kodrix-IDE-1.2.0.dmg
            ```
          draft: false
          prerelease: true
          files: |
            all-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}