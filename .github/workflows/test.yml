name: Test

on:
  push:
    branches: [test, main, feature/*]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-test:
    name: "Desktop Test (JDK ${{ matrix.java }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Setup Android SDK & accept licences
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile shared (desktop)
        run: ./gradlew :shared:compileKotlinDesktop --no-daemon

      - name: Compile desktopApp
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

      - name: Run tests (shared)
        run: ./gradlew :shared:desktopTest --no-daemon 2>&1 || true

      - name: Run tests (desktopApp)
        run: ./gradlew :desktopApp:test --no-daemon 2>&1 || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14